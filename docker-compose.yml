services:
  postgres:
    image: postgres:16
    container_name: narrivex-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narrivex}
      POSTGRES_USER: ${POSTGRES_USER:-narrivex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./narrivex-backend
    container_name: narrivex-backend
    ports:
      - '3001:3001'
    env_file:
      - ./narrivex-backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-narrivex}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:-narrivex}
    depends_on:
      - postgres

  frontend:
    build: ./narrivex-frontend
    container_name: narrivex-frontend
    ports:
      - '3000:3000'
    env_file:
      - ./narrivex-frontend/.env.local
    depends_on:
      - backend

volumes:
  postgres_data: